version: 2
updates:
  # 依赖（仅 devDependencies：TypeScript / ESLint / changesets / tsx 等）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
  # GitHub Actions 工作流本身
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
