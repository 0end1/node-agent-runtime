name: Desktop

# 【移出至产品侧 HANDOFF（2026-09-10，底座收敛）】本工作流已随桌面端整体移出底座范围：
# 底座侧不再新增功能、不升级 Tauri 与插件链，也不维护其触发策略（现为 tag v* / 手动，不进常规 CI 前置）。
# 方向与投入归产品侧（承接：docs/product-direction.md §4 / docs/product-build-paths.md）；判定见
# docs/base-convergence.md §2.3，M6 回填见 docs/m6-productionization.md §5。
#
# P5.3 三平台构建矩阵（含 sidecar node 三平台三元组）
# P5.2 macOS 签名 + 公证（证书与账号信息走仓库 secrets）
# P5.4 自动更新：TAURI_SIGNING_PRIVATE_KEY 为更新包签名，产物随 Release 发布
#
# 触发：tag `v*` 发布，或手动 workflow_dispatch。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # 上传 Release 产物（P5.4 更新端点指向 GitHub Release）

jobs:
  build:
    name: desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：默认出 runner 原生架构（macos-latest = arm64）。
          # 需要 x64 时新增一行并用 `--target x86_64-apple-darwin`，
          # 同时用 NODE_BIN 指向 x64 的 node（交叉编译不能复用 arm64 解释器）。
          - os: macos-latest
            platform: macos
            args: ""
          - os: ubuntu-latest
            platform: linux
            args: ""
          - os: windows-latest
            platform: windows
            args: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # 引擎包必须先构建：sidecar 的 esbuild bundle 依赖 packages/*/dist
      - run: npm ci
      - run: npm run build

      - name: install desktop deps (sidecar bundler)
        run: npm install
        working-directory: examples/desktop-tauri

      - uses: dtolnay/rust-toolchain@stable

      - name: install linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: build and (optionally) release
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: examples/desktop-tauri
          tagName: v__VERSION__
          releaseName: "Agent Runtime Console v__VERSION__"
          releaseBody: "桌面控制台（macOS .app/.dmg · Linux .AppImage/.deb · Windows .msi/.exe）。更新日志见 CHANGELOG.md。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ---- P5.2 macOS 签名与公证 ----
          # 未配置时 tauri-action 会跳过签名，产物仍是"未签名"（Gatekeeper 会拒绝）。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # ---- P5.4 更新包签名 ----
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            examples/desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg
            examples/desktop-tauri/src-tauri/target/release/bundle/macos/*.app
            examples/desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            examples/desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
            examples/desktop-tauri/src-tauri/target/release/bundle/msi/*.msi
            examples/desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
