name: Release

# P4.4 版本与发布编排
#   · push main / 手动触发 → changesets 开 "Version Packages" PR，合并后自动打 tag 并发布；
#   · push tag v*        → 直接按仓库当前版本 `npm publish --provenance`（逐包）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 发布凭据（OIDC Trusted Publishing，免 token）：
#   12 包已上架后，在 npm 后台为每个包配置 Trusted Publisher（GitHub Actions，
#   指定本仓库 + release.yml + 环境），即可删除下方 NPM_TOKEN / NODE_AUTH_TOKEN
#   两行 env，publish 步骤会自动用 OIDC 签发的短期令牌，免去 90 天必轮换的 secret。
#   当前仍用仓库 secret NPM_TOKEN（首发阶段尚未配 Trusted Publisher）。
permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance（OIDC 必需；配好 Trusted Publisher 后即可免 token）

jobs:
  changesets:
    name: changesets (version PR / publish)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # dist 必须是最新的：changeset publish 直接发布 files:["dist"] 的内容
      - run: npm run build
      - name: version or publish
        uses: changesets/action@v2
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  publish-tag:
    name: publish from tag (provenance)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - name: npm publish --provenance (workspaces)
        run: npm publish --workspaces --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
