[package]
name = "desktop-tauri"
version = "0.1.0"
description = "Agent Runtime Console — Desktop shell (Tauri v2)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
