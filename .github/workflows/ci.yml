name: CI

# 分支策略：日常开发在 dev 分支（本地 `npm run ci` 自检，不触发远端门禁），
# CI 只在 main 上跑 —— dev → main 提 PR 时即触发（pull_request base=main），
# 合并后 push main 再跑一次；main 同为 changesets Version Packages PR 的目标分支。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # P2.1 主流程：typecheck → lint → test → build → API 面复核（P2.7）
  # Node matrix：固定 22.x —— @node-agent-runtime/store-sqlite 依赖 node:sqlite（>=22.5），
  # 根 engines 与包 engines 的统一口径待 P4.3 收敛，届时再扩 matrix。
  quality:
    name: quality (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint (P2.2)
        run: npm run lint
      - name: test
        run: npm run test
      - name: build
        run: npm run build
      - name: api surface check (P2.7)
        run: npm run check:api

  # P2.3 覆盖率门禁：逐包 行≥80 / 分支≥60 / 函数≥55；全仓均值 行≥90 / 分支≥78 / 函数≥85
  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run coverage:gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/report.txt
          if-no-files-found: warn

  # P2.5 依赖审计门：高危阻断
  audit:
    name: npm audit (P2.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - name: audit (production deps, high+ blocks)
        run: npm audit --omit=dev --audit-level=high

  # P2.4 E2E（吸收 A2）：CLI → Web 全流程（ask 审批 → approve 落盘 → artifact → 续跑）。
  # 桌面形态已于 2026-09-17 出库（提交 6cf5ebf）：scripts/e2e/desktop.mjs、E2E_DESKTOP 开关、
  # --with-desktop 均随之移除，本 job 现只覆盖 examples/cli.ts 与 examples/web/ 两个验证载体。
  # 注：job 名（cross-form E2E）与分支保护的 required check 绑定，改名须同步改 GitHub 侧设置。
  e2e:
    name: cross-form E2E (P2.4)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - name: e2e (CLI + Web; 自动 prebuild)
        run: npm run e2e
