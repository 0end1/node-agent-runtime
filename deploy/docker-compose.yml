# P5.6 · 最小生产编排（在仓库根目录执行）：
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml --profile edge up -d   # 附带 nginx 边缘反代
#
# 安全约定：
#   · 控制台只监听 127.0.0.1:8787（对外一律走 nginx + TLS）；
#   · 密钥用 env_file / secrets 注入，绝不写进镜像；
#   · 数据落在命名卷 `runtime-data`，备份见 deploy/README.md。

services:
  console:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: agent-runtime/console:0.2.0
    env_file:
      - ./env/prod.env.example # 生产请换成私有文件（不要提交真实密钥）
    environment:
      HOST: 0.0.0.0 # 容器内监听（宿主侧只暴露 127.0.0.1）
      PORT: 8787
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - runtime-data:/app/.runtime-data
    restart: unless-stopped

  # 边缘反代（可选 profile）：终止 TLS、转发 SSE
  nginx:
    image: nginx:1.27-alpine
    profiles: ["edge"]
    depends_on:
      - console
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/agent-runtime.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  runtime-data:
