<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Runtime · Console</title>
<style>
  :root {
    --bg: #0b0f17;
    --panel: #111827;
    --panel-2: #0f1522;
    --border: #1f2a3d;
    --text: #e6edf7;
    --muted: #8b9bb4;
    --accent: #38bdf8;
    --accent-2: #a78bfa;
    --ok: #34d399;
    --err: #f87171;
    --warn: #fbbf24;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1000px 500px at 15% -10%, rgba(56,189,248,.10), transparent 60%),
      radial-gradient(900px 480px at 90% -10%, rgba(167,139,250,.12), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    background: rgba(15, 21, 34, .7);
    backdrop-filter: blur(8px);
  }
  .logo {
    width: 34px; height: 34px; border-radius: 10px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #071018; font-weight: 800; font-size: 16px;
    box-shadow: 0 4px 18px rgba(56,189,248,.35);
  }
  .title { font-weight: 700; font-size: 15px; letter-spacing: .2px; }
  .subtitle { color: var(--muted); font-size: 12px; }
  .status-wrap { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .badge {
    font-size: 11px; color: var(--muted);
    border: 1px solid var(--border); background: var(--panel);
    padding: 4px 10px; border-radius: 999px;
    font-family: var(--mono);
  }
  .status {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 999px;
  }
  .status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #64748b; transition: background .2s;
  }
  .status.running .dot { background: var(--accent); animation: blink 1s infinite; }
  .status.done .dot { background: var(--ok); }
  .status.error .dot { background: var(--err); }
  @keyframes blink { 50% { opacity: .25; } }

  /* ---------- transcript ---------- */
  main { flex: 1; overflow-y: auto; padding: 26px 0 12px; }
  .thread { max-width: 780px; margin: 0 auto; padding: 0 18px; display: flex; flex-direction: column; gap: 18px; }

  .row { display: flex; gap: 12px; animation: rise .28s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .avatar {
    flex: none; width: 30px; height: 30px; border-radius: 9px;
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
  }
  .row.user .avatar { background: #1e3a5f; color: #7dd3fc; }
  .row.agent .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #08121f; }
  .bubble {
    min-width: 0; max-width: 86%;
    padding: 9px 14px; border-radius: 4px 14px 14px 14px;
    background: var(--panel); border: 1px solid var(--border);
    white-space: pre-wrap; overflow-wrap: break-word;
  }
  .row.user .bubble { background: #16283f; border-color: #1f3b5c; border-radius: 14px 4px 14px 14px; }

  .row.agent .bubble { max-width: 100%; background: transparent; border: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }

  /* step / tool trace */
  .trace { display: flex; flex-direction: column; gap: 6px; }
  .step-hd {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .step-hd .no {
    color: var(--accent); border: 1px solid #244b66; background: #0e2233;
    padding: 1px 7px; border-radius: 999px;
  }
  .thinking {
    font-size: 13px; color: var(--muted); font-style: italic;
    border-left: 2px solid #2c3e57; padding-left: 10px; margin: 2px 0;
  }
  .tool-card {
    font-family: var(--mono); font-size: 12px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--panel-2); overflow: hidden;
  }
  .tool-card .head {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 11px; border-bottom: 1px solid var(--border);
  }
  .tool-card .head .ico { color: var(--warn); font-weight: 700; }
  .tool-card .head .name { color: #93c5fd; font-weight: 600; }
  .tool-card .head .args { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-card .head .spin {
    margin-left: auto; width: 12px; height: 12px; flex: none;
    border: 2px solid #2b4058; border-top-color: var(--accent);
    border-radius: 50%; animation: rot .8s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  .tool-card .result {
    padding: 7px 11px; color: var(--muted); font-size: 11.5px;
    max-height: 110px; overflow: auto; white-space: pre-wrap;
  }
  .tool-card.ok { border-color: #1c3a31; }
  .tool-card.ok .head .ico { color: var(--ok); }
  .tool-card.ok .head .spin { display: none; }
  .tool-card.fail { border-color: #4a2326; }
  .tool-card.fail .head .ico { color: var(--err); }
  .tool-card.fail .head .spin { display: none; }
  .tool-card .time { color: #3f4f66; margin-left: auto; font-size: 10.5px; }

  .answer {
    font-size: 14.5px; line-height: 1.75; color: var(--text);
    background: linear-gradient(180deg, rgba(56,189,248,.06), rgba(167,139,250,.05));
    border: 1px solid #1e3350; border-radius: 12px; padding: 12px 16px;
  }
  .answer.cursor::after {
    content: "▍"; color: var(--accent); animation: blink 1s infinite;
  }
  .meta { font-family: var(--mono); font-size: 10.5px; color: #41516a; }
  .meta b { color: var(--muted); font-weight: 600; }

  .typing {
    display: flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: 12.5px;
  }
  .typing .bar { display: flex; gap: 4px; }
  .typing .bar i {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); animation: bob 1.2s infinite;
  }
  .typing .bar i:nth-child(2) { animation-delay: .15s; }
  .typing .bar i:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%,60%,100% { transform: translateY(0); opacity:.4 } 30% { transform: translateY(-4px); opacity:1 } }

  /* ---------- suggestions ---------- */
  .suggest {
    max-width: 780px; margin: 0 auto; padding: 4px 18px 0;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .suggest button {
    font-size: 12px; color: #9fd8f5; cursor: pointer;
    background: rgba(30,58,95,.25); border: 1px solid #24425f;
    padding: 6px 12px; border-radius: 999px;
    transition: .15s;
  }
  .suggest button:hover { background: #1c3a5a; border-color: #3b6a97; }

  /* ---------- composer ---------- */
  footer { padding: 12px 22px 18px; border-top: 1px solid var(--border); background: rgba(11,15,23,.8); }
  .composer {
    max-width: 780px; margin: 0 auto;
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 8px 8px 8px 14px;
  }
  .composer:focus-within { border-color: #2e5a7a; box-shadow: 0 0 0 3px rgba(56,189,248,.12); }
  textarea {
    flex: 1; resize: none; border: none; outline: none; background: transparent;
    color: var(--text); font: inherit; line-height: 1.5; max-height: 140px; padding: 6px 0;
  }
  textarea::placeholder { color: #4b5c75; }
  button.send {
    flex: none; border: none; cursor: pointer;
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #08121f; font-size: 17px; font-weight: 700;
    transition: filter .15s, transform .1s;
  }
  button.send:hover { filter: brightness(1.1); }
  button.send:active { transform: scale(.95); }
  button.send:disabled { filter: grayscale(1) brightness(.55); cursor: not-allowed; }

  .thread .err-bubble {
    border: 1px solid #4a2326; background: rgba(127,29,29,.18);
    color: #fca5a5; border-radius: 12px; padding: 10px 14px; font-size: 13px;
  }
  @media (max-width: 620px) {
    .bubble { max-width: 100%; }
    .row.agent .bubble { max-width: 100%; }
    .subtitle { display: none; }
  }

  /* ---------- M3 governance (approval / sandbox) ---------- */
  .approval-card {
    font-family: var(--mono); font-size: 12.5px;
    border: 1px solid #4a3a1e; border-radius: 12px;
    background: rgba(251,191,36,.08); overflow: hidden;
    align-self: flex-start; max-width: 560px; margin-top: 4px;
  }
  .approval-card .head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid #3a2f18;
  }
  .approval-card .head .ico { color: var(--warn); }
  .approval-card .head .name { color: #fde68a; font-weight: 600; }
  .approval-card .body { padding: 9px 12px; color: var(--text); line-height: 1.6; }
  .approval-card .body b { color: #fcd34d; }
  .approval-card .reason, .approval-card .args {
    color: var(--muted); font-size: 11.5px; margin-top: 4px;
    white-space: pre-wrap; overflow-wrap: break-word;
  }
  .approval-card .actions { display: flex; gap: 8px; padding: 0 12px 12px; }
  .approval-card .actions button {
    cursor: pointer; font-size: 12px; padding: 6px 12px; border-radius: 8px;
    border: 1px solid #3b6a97; background: #16283f; color: #93c5fd; transition: .15s;
  }
  .approval-card .actions button:hover { background: #1c3a5a; }
  .approval-card .actions button.danger { border-color: #5b2a2e; color: #fca5a5; background: #2a1518; }
  .approval-card .actions button.danger:hover { background: #3a1c20; }
  .approval-card.resolved { opacity: .7; }
  .approval-card .resolved-label { padding: 0 12px 12px; color: var(--muted); font-size: 12px; }

  .sandbox-write {
    font-family: var(--mono); font-size: 12px; color: var(--ok);
    background: rgba(52,211,153,.07); border: 1px solid #1c3a31; border-radius: 10px;
    padding: 8px 12px; align-self: flex-start; max-width: 560px; margin-top: 4px;
  }
  .sandbox-write b { color: #6ee7b7; }
  .sandbox-write pre {
    margin-top: 6px; color: var(--muted); font-size: 11px;
    max-height: 140px; overflow: auto; white-space: pre-wrap;
  }

  /* ---------- side panel (sessions / artifacts / resume) ---------- */
  main { flex-direction: row; align-items: stretch; }
  .thread { flex: 1; min-width: 0; }
  #side {
    width: 268px; flex: none; border-left: 1px solid var(--border);
    background: rgba(15,21,34,.5); padding: 14px 12px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 18px;
  }
  .side-sec { display: flex; flex-direction: column; gap: 8px; }
  .side-hd {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px;
  }
  .side-hd button {
    margin-left: auto; cursor: pointer; width: 22px; height: 22px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel); color: var(--accent);
    font-size: 14px; line-height: 1;
  }
  .side-hd button:hover { border-color: #2e5a7a; }
  .side-list { display: flex; flex-direction: column; gap: 6px; }
  .side-item {
    font-size: 12px; cursor: pointer; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .side-item:hover { border-color: #2e5a7a; }
  .side-item.active { border-color: var(--accent); color: #bfe6ff; }
  .side-empty { font-size: 11px; color: #41516a; }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #side { width: auto; border-left: none; border-top: 1px solid var(--border); flex-direction: row; flex-wrap: wrap; }
    .side-sec { flex: 1; min-width: 160px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">◇</div>
  <div>
    <div class="title">Agent Runtime Console</div>
    <div class="subtitle">事件驱动 · 多步推理 · 工具调用 · TypeScript</div>
  </div>
  <div class="status-wrap">
    <span class="badge" id="provider">connecting…</span>
    <span class="status" id="status"><span class="dot"></span><span id="statusText">就绪</span></span>
  </div>
</header>

<main id="main">
  <div class="thread" id="thread"></div>
  <aside id="side">
    <div class="side-sec">
      <div class="side-hd">会话 <button id="newSession" title="新建会话">＋</button></div>
      <div class="side-list" id="sessionList"></div>
    </div>
    <div class="side-sec">
      <div class="side-hd">Artifact</div>
      <div class="side-list" id="artifactList"></div>
    </div>
    <div class="side-sec">
      <div class="side-hd">续跑 (checkpoints)</div>
      <div class="side-list" id="checkpointList"></div>
    </div>
  </aside>
</main>

<div class="suggest" id="suggest">
  <button data-q="3.5 + 2 * 4 = ?">🧮 (3.5+2)×4</button>
  <button data-q="现在几点了？">🕐 现在几点</button>
  <button data-q="北京天气怎么样？">🌤 北京天气</button>
  <button data-q="100 美元等于多少人民币？">💱 汇率换算</button>
  <button data-q="你今天能做什么？">🤖 能力介绍</button>
</div>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button class="send" id="send" title="发送">↵</button>
  </div>
</footer>

<script>
"use strict";
/* global EventSource */

const $ = (id) => document.getElementById(id);
const thread = $("thread");
const input = $("input");
const sendBtn = $("send");
const statusEl = $("status");
const statusText = $("statusText");
const providerEl = $("provider");

let sessionId =
  localStorage.getItem("agent-session") ||
  (crypto.randomUUID ? crypto.randomUUID() : "s-" + Date.now());
localStorage.setItem("agent-session", sessionId);

let busy = false;
let source = null;
const MAX_TRANSCRIPT = 120; // drop oldest agent rows to keep DOM lean

function setStatus(mode, text) {
  statusEl.classList.remove("running", "done", "error");
  if (mode) statusEl.classList.add(mode);
  statusText.textContent = text;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
  );
}
function autoGrow() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
}
function scrollDown() { requestAnimationFrame(() => {
  const m = $("main"); m.scrollTop = m.scrollHeight;
}); }

function row(kind) {
  while (thread.children.length > MAX_TRANSCRIPT) thread.removeChild(thread.firstChild);
  const el = document.createElement("div");
  el.className = "row " + kind;
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = kind === "user" ? "你" : "AI";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  el.append(avatar, bubble);
  thread.append(el);
  scrollDown();
  return bubble;
}

function showUser(text) {
  const b = row("user");
  b.textContent = text;
}
function showError(text) {
  const b = row("agent");
  const box = document.createElement("div");
  box.className = "err-bubble";
  box.textContent = text;
  b.append(box);
}

// ---- trace rendering state ---------------------------------------------
let active = null; // { stepEl, stepNo, cards:Map<toolCallId,{el,finish}> }

function traceBlock() {
  if (active && !active.closed) return active;
  const bubble = row("agent");
  const trace = document.createElement("div");
  trace.className = "trace";
  bubble.append(trace);
  active = { el: trace, no: 0, cards: new Map(), closed: false };
  return active;
}

function beginStep(no) {
  if (active && !active.closed) closeStep();
  const t = traceBlock();
  t.no = no;
  const hd = document.createElement("div");
  hd.className = "step-hd";
  hd.innerHTML = '<span class="no">STEP ' + no + "</span><span>推理中…</span>";
  t.el.append(hd);
}
function closeStep() {
  if (!active || active.closed) return;
  // if it only ever contained its header & nothing else, drop it
  if (active.el.childElementCount <= 1) active.el.remove();
  active.closed = true;
}

function addThinking(text) {
  const t = traceBlock();
  const p = document.createElement("div");
  p.className = "thinking";
  p.textContent = text;
  t.el.append(p);
  scrollDown();
}
function addToolStart(call) {
  const t = traceBlock();
  const card = document.createElement("div");
  card.className = "tool-card";
  const args = call.arguments ? JSON.stringify(call.arguments) : "{}";
  card.innerHTML =
    '<div class="head">' +
    '<span class="ico">⚙</span>' +
    '<span class="name"></span>' +
    '<span class="args"></span>' +
    '<span class="spin"></span></div>' +
    '<div class="result" hidden></div>';
  card.querySelector(".name").textContent = call.name + "()";
  card.querySelector(".args").textContent = args.length > 120 ? args.slice(0, 120) + "…" : args;
  t.el.append(card);
  t.cards.set(call.id, card);
  scrollDown();
}
function addToolEnd(call, result, ok) {
  if (active) {
    const card = active.cards.get(call.id);
    if (card) {
      card.classList.add(ok ? "ok" : "fail");
      const resBox = card.querySelector(".result");
      resBox.hidden = false;
      const pretty = (() => {
        try { const j = JSON.parse(result); return JSON.stringify(j, null, 1); }
        catch { return result; }
      })();
      resBox.textContent = pretty.length > 600 ? pretty.slice(0, 600) + "…" : pretty;
      active.cards.delete(call.id);
      const head = card.querySelector(".head");
      if (ok) {
        head.querySelector(".ico").textContent = "✓";
        const t = document.createElement("span");
        t.className = "time";
        t.textContent = result.length + "B";
        head.append(t);
      }
    }
  }
  scrollDown();
}

function finishRun(ev) {
  closeStep();
  const bubble = row("agent");
  const answer = document.createElement("div");
  answer.className = "answer cursor";
  answer.textContent = " ";
  bubble.append(answer);
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML =
    "round-trips <b>" + ev.steps + "</b>" +
    " · tokens <b>" + (ev.usage ? ev.usage.inputTokens + "+" + ev.usage.outputTokens : "n/a") + "</b>";
  bubble.append(meta);

  // typewriter reveal
  const out = ev.output || "（空回复）";
  let i = 0;
  const speed = Math.max(4, Math.min(14, Math.round(420 / Math.max(out.length, 1))));
  const timer = setInterval(() => {
    i = Math.min(out.length, i + 2);
    answer.textContent = out.slice(0, i);
    scrollDown();
    if (i >= out.length) {
      clearInterval(timer);
      answer.classList.remove("cursor");
    }
  }, speed);
  return { answer, out };
}

// ---- M3 governance rendering (approval / sandbox write) -----------------
function renderApproval(p) {
  const bubble = row("agent");
  const box = document.createElement("div");
  box.className = "approval-card";
  box.dataset.decision = p.decisionId;
  const args = p.arguments ? JSON.stringify(p.arguments) : "";
  box.innerHTML =
    '<div class="head"><span class="ico">⚠</span><span class="name">需要授权</span></div>' +
    '<div class="body">工具 <b>' + esc(p.toolName) + '</b>' +
    '<div class="reason">' + esc(p.reason || "") + '</div>' +
    (args ? '<div class="args">' + esc(args) + '</div>' : '') + '</div>' +
    '<div class="actions">' +
    '<button data-act="approve">批准</button>' +
    '<button data-act="always">始终允许</button>' +
    '<button data-act="deny" class="danger">拒绝</button></div>';
  box.querySelector('[data-act="approve"]').onclick = () => decide(p.decisionId, false);
  box.querySelector('[data-act="always"]').onclick = () => decide(p.decisionId, true);
  box.querySelector('[data-act="deny"]').onclick = () => deny(p.decisionId);
  bubble.append(box);
  scrollDown();
}
function decide(decisionId, always) {
  fetch("/api/approve", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ decisionId, always }),
  });
}
function deny(decisionId) {
  fetch("/api/deny", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ decisionId, reason: "用户拒绝" }),
  });
}
function updateApproval(decisionId, status) {
  const box = thread.querySelector('.approval-card[data-decision="' + decisionId + '"]');
  if (!box) return;
  box.classList.add("resolved", status);
  box.querySelector(".actions").innerHTML =
    '<span class="resolved-label">' +
    (status === "denied" ? "已拒绝" : status === "always" ? "已始终允许" : "已批准") + '</span>';
}
function renderSandboxWrite(p) {
  const bubble = row("agent");
  const box = document.createElement("div");
  box.className = "sandbox-write";
  const diff = p.diff ? '<pre>' + esc(p.diff) + '</pre>' : '';
  box.innerHTML = '<span class="ico">✎</span> 沙箱写入 <b>' +
    esc(p.toolName) + '</b> → ' + esc((p.paths || []).join(", ")) + diff;
  bubble.append(box);
  scrollDown();
}

// ---- M2/M4 side panel (sessions / artifacts / resume) -----------------
let lastTaskId = null;
function fillSessions() {
  fetch("/api/sessions").then((r) => r.json()).then((list) => {
    const el = $("sessionList");
    el.innerHTML = "";
    if (!list.length) { el.innerHTML = '<div class="side-empty">（暂无会话）</div>'; return; }
    for (const s of list) {
      const it = document.createElement("div");
      it.className = "side-item" + (s.id === sessionId ? " active" : "");
      it.textContent = (s.title || s.id.slice(-6)) + " · " + s.status;
      it.onclick = () => setSession(s.id);
      el.append(it);
    }
  }).catch(() => {});
}
function setSession(id) {
  sessionId = id;
  localStorage.setItem("agent-session", id);
  thread.innerHTML = "";
  fillSessions();
  fillArtifacts();
  setStatus("done", "已切换会话 " + id.slice(-6));
}
function fillArtifacts() {
  fetch("/api/artifacts?session=" + encodeURIComponent(sessionId)).then((r) => r.json()).then((list) => {
    const el = $("artifactList");
    el.innerHTML = "";
    if (!list.length) { el.innerHTML = '<div class="side-empty">（暂无 artifact）</div>'; return; }
    for (const a of list) {
      const it = document.createElement("div");
      it.className = "side-item";
      it.textContent = a.name + " · " + a.kind;
      it.onclick = () => showArtifact(a.id);
      el.append(it);
    }
  }).catch(() => {});
}
function showArtifact(id) {
  fetch("/api/artifact/" + encodeURIComponent(id)).then((r) => r.json()).then((a) => {
    const bubble = row("agent");
    const box = document.createElement("div");
    box.className = "sandbox-write";
    if (a.kind === "url") box.innerHTML = "🔗 <b>" + esc(a.name) + "</b> → " + esc(a.locator);
    else box.innerHTML = "📄 <b>" + esc(a.name) + "</b> (" + esc(a.mime) + ")<pre>" + esc(a.text || "") + "</pre>";
    bubble.append(box);
    scrollDown();
  }).catch(() => {});
}
function fillCheckpoints() {
  const el = $("checkpointList");
  if (!lastTaskId) { el.innerHTML = '<div class="side-empty">（先对话生成任务）</div>'; return; }
  fetch("/api/checkpoints?task=" + encodeURIComponent(lastTaskId)).then((r) => r.json()).then((list) => {
    el.innerHTML = "";
    if (!list.length) { el.innerHTML = '<div class="side-empty">（暂无 checkpoint）</div>'; return; }
    for (const c of list) {
      const it = document.createElement("div");
      it.className = "side-item";
      it.textContent = "checkpoint @ step " + c.step;
      it.onclick = () => {
        const cont = prompt("续跑说明（可留空）：");
        resume(c.id, cont || undefined);
      };
      el.append(it);
    }
  }).catch(() => {});
}
async function resume(checkpointId, continuation) {
  if (busy) return;
  setBusy(true);
  showUser(continuation ? "（续跑）" + continuation : "（续跑 checkpoint）");
  try {
    const resp = await fetch("/api/resume", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ checkpointId, continuation }),
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const dataLine = chunk.split("\n").find((l) => l.startsWith("data: "));
        if (dataLine) { const msg = JSON.parse(dataLine.slice(6)); handle(msg.type, msg.payload); }
      }
    }
  } catch (err) {
    showError("⚠ " + (err instanceof Error ? err.message : String(err)));
  } finally {
    setBusy(false);
  }
}

function send(text) {
  if (busy) return;
  const q = (text ?? input.value).trim();
  if (!q) return;
  input.value = "";
  autoGrow();
  showUser(q);
  setBusy(true);

  if (source) source.close();
  source = new EventSource(
    "/api/chat?input=" + encodeURIComponent(q) + "&session=" + encodeURIComponent(sessionId)
  );

  source.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    handle(msg.type, msg.payload);
  };
  source.onerror = () => {
    if (source) { source.close(); source = null; }
  };
}

function handle(type, payload) {
  switch (type) {
    case "system":
      providerEl.textContent = payload.provider === "mock"
        ? "mock · 免密钥" : "openai · 兼容端点";
      break;
    case "message:user":
      break; // we already echoed the user bubble locally
    case "step:start":
      beginStep(payload.step);
      setStatus("running", "步骤 " + payload.step);
      break;
    case "model:response": {
      const text = payload.message && payload.message.content;
      const hasTools = payload.message && payload.message.toolCalls && payload.message.toolCalls.length;
      if (text) addThinking(text);
      if (hasTools) setStatus("running", "执行工具…");
      break;
    }
    case "tool:start":
      addToolStart(payload.toolCall);
      break;
    case "tool:end":
      addToolEnd(payload.toolCall, payload.result, payload.ok);
      break;
    case "run:end":
      finishRun({ steps: payload.steps, output: payload.output, usage: payload.usage });
      setStatus("done", "完成 · " + payload.steps + " 步");
      break;
    case "run:error":
      closeStep();
      showError("⚠ " + payload.error);
      setStatus("error", "出错");
      break;
    case "permission:request":
      renderApproval(payload);
      break;
    case "permission:approved":
      updateApproval(payload.decisionId, payload.always ? "always" : "approved");
      break;
    case "permission:denied":
      updateApproval(payload.decisionId, "denied");
      break;
    case "sandbox:write":
      if (payload.ok) renderSandboxWrite(payload);
      break;
    case "done":
      if (source) { source.close(); source = null; }
      if (!payload.ok && payload.error) {
        closeStep();
        showError("⚠ " + payload.error);
        setStatus("error", "出错");
      }
      if (payload.sessionId && payload.sessionId !== sessionId) {
        sessionId = payload.sessionId;
        localStorage.setItem("agent-session", sessionId);
      }
      lastTaskId = payload.taskId || lastTaskId;
      fillSessions();
      fillArtifacts();
      fillCheckpoints();
      setBusy(false);
      break;
  }
}

function setBusy(v) {
  busy = v;
  sendBtn.disabled = v;
  input.disabled = v;
  if (v) { input.placeholder = "Agent 正在思考…"; }
  else { input.placeholder = "输入消息，Enter 发送，Shift+Enter 换行"; input.focus(); }
}

// ---- wiring --------------------------------------------------------------
// 常驻治理事件流（M3 审批 / 沙箱写），与 /api/chat 的 run 流解耦。
const govSource = new EventSource("/api/events");
govSource.onmessage = (ev) => {
  let msg;
  try { msg = JSON.parse(ev.data); } catch { return; }
  handle(msg.type, msg.payload);
};
govSource.onerror = () => { /* 浏览器会自动重连 */ };

sendBtn.addEventListener("click", () => send(input.value));
$("newSession").addEventListener("click", async () => {
  const r = await fetch("/api/new", { method: "POST" });
  const { id } = await r.json();
  setSession(id);
});
fillSessions();
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); }
  autoGrow();
});
$("suggest").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-q]");
  if (btn) send(btn.dataset.q);
});
input.focus();
</script>
