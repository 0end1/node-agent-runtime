name: Deprecate 0.4.0 (one-off)

# 一次性发布收尾任务：把有缺陷的 0.4.0 标记为 deprecated，引导用户升级到 0.4.1+。
#
# 背景：0.4.0 缺少 workspace 内部依赖声明（core/host 等包 install 后无法被解析），
#       0.4.1 已补齐并作为 latest。deprecate 只写一条提示、可逆，不影响 latest。
#
# 为什么走 CI：npm deprecate 不支持 OIDC，只能用 token 鉴权；
#              本机 NPM_TOKEN 非最新（未 bypass 2FA），而仓库 secret NPM_TOKEN 已 bypass 2FA。
#
# 用法：GitHub Actions → Deprecate 0.4.0 → Run workflow。
#       确认 12 包均生效后，删除本文件即可。
on:
  workflow_dispatch:

jobs:
  deprecate:
    name: deprecate 0.4.0 (12 packages)
    runs-on: ubuntu-latest
    # setup-node 会读取 NODE_AUTH_TOKEN 并写入 .npmrc 的 _authToken，供 npm deprecate 使用。
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
      - name: verify npm auth
        run: npm whoami
      - name: run deprecate script
        run: node scripts/deprecate-040.mjs
      - name: verify deprecation
        run: |
          npm view @node-agent-runtime/types@0.4.0 deprecated
          npm view @node-agent-runtime/core@0.4.0 deprecated
