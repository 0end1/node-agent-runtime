name: Release

# P4.4 版本与发布编排
#   · push main / 手动触发 → changesets 开 "Version Packages" PR，合并后自动打 tag 并发布；
#   · push tag v*        → 直接按仓库当前版本 `npm publish --provenance`（逐包）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 发布凭据（OIDC Trusted Publishing，免 token）：
#   - 两个发布 job 已声明 environment: npm，且 npm 后台 12 包均已配置 Trusted Publisher
#     （GitHub Actions / 0end1 / node-agent-runtime / release.yml / environment:npm）。
#   - publish 步骤通过 GitHub OIDC（id-token: write）向 npm 换取短期令牌，无需 NODE_AUTH_TOKEN。
#   - 仓库 secret NPM_TOKEN 保留备用，但发布流程已不再引用；如需回退可重新加回下方 env 两行。
permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance（OIDC 必需；配好 Trusted Publisher 后即可免 token）

jobs:
  changesets:
    name: changesets (version PR / publish)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # dist 必须是最新的：changeset publish 直接发布 files:["dist"] 的内容
      - run: npm run build
      - name: version or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  publish-tag:
    name: publish from tag (provenance)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - name: npm publish --provenance (workspaces)
        run: npm publish --workspaces --access public --provenance
        env:
          NPM_CONFIG_PROVENANCE: "true"
