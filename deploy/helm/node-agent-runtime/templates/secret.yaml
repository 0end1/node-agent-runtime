{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "node-agent-runtime.fullname" . }}
  labels:
    {{- include "node-agent-runtime.labels" . | nindent 4 }}
type: Opaque
{{- with .Values.secret }}
stringData:
  {{- range $key, $val := . }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
{{- end }}
