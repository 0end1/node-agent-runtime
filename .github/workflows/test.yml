name: Test

# 公开仓基础质量门禁：PR / push main 时跑全量测试（含 pretest build）。
# 之后在 main 的分支保护规则里把本 job 加入 "Require status checks"。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test
